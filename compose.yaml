services:
  postgres:
    image: 'postgres:latest'
    container_name: fitapp-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=fitapp
      - POSTGRES_USER=fitapp
      - POSTGRES_PASSWORD=1234
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitapp -d fitapp']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitapp-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/fitapp
      - SPRING_DATASOURCE_USERNAME=fitapp
      - SPRING_DATASOURCE_PASSWORD=1234
    ports:
      - '8080:8080'

volumes:
  postgres_data: